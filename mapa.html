<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Tepuy Ka – Universo Ka</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',system-ui,sans-serif}
html,body{height:100%;overflow:hidden;background:#0b1d1f;color:#fff}
#escena{position:fixed;inset:0;overflow:hidden;touch-action:none;cursor:grab;-webkit-user-select:none;user-select:none}
#escena:active{cursor:grabbing}
.ke-cielo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:saturate(1.15) brightness(.85);pointer-events:none}
.ke-mundo{position:absolute;left:0;top:0;will-change:transform}
.ke-capa{position:absolute;left:0;top:0;will-change:transform;pointer-events:none}
.ke-capa img{display:block;width:100%;height:100%;pointer-events:none;-webkit-user-drag:none}
.ke-puntos{pointer-events:none}
.ke-punto{all:unset;box-sizing:border-box;position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;cursor:pointer;pointer-events:auto;-webkit-tap-highlight-color:transparent;padding:6px}
.ke-luz{position:absolute;left:50%;top:50%;width:120px;height:120px;transform:translate(-50%,-62%);border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--ac) 55%,transparent),transparent 68%);filter:blur(4px);pointer-events:none;animation:latido 4s ease-in-out infinite}
.ke-punto.activo .ke-luz{width:170px;height:170px;animation-duration:3s}
.ke-punto.dormido .ke-luz{opacity:.55;width:90px;height:90px}
@keyframes latido{0%,100%{opacity:.75;scale:1}50%{opacity:1;scale:1.12}}
.ke-nom{position:relative;display:block;min-height:44px;padding:8px 16px;border-radius:24px;background:rgba(5,22,24,.62);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid color-mix(in srgb,var(--ac) 70%,transparent);box-shadow:0 0 22px color-mix(in srgb,var(--ac) 35%,transparent);font-size:14px;font-weight:700;text-align:center;white-space:nowrap;text-shadow:0 0 10px rgba(0,0,0,.6);line-height:1.2}
.ke-nom small{display:block;font-weight:400;font-size:11px;opacity:.8;margin-top:2px}
.ke-punto.dormido .ke-nom{opacity:.88;font-weight:600}
.ke-punto:hover .ke-nom,.ke-punto:focus-visible .ke-nom{box-shadow:0 0 32px color-mix(in srgb,var(--ac) 75%,transparent)}
.ke-punto:focus-visible{outline:2px solid #7be6d6;border-radius:28px}
/* Punto con imagen PNG propia: el punto (x,y) es el centro de la imagen; el nombre cuelga debajo */
.ke-punto.con-img{padding:0}
.ke-img{display:block;height:auto;position:relative;pointer-events:none;-webkit-user-drag:none;transition:transform .35s ease;
 filter:drop-shadow(0 0 8px color-mix(in srgb,var(--ac) 70%,transparent)) drop-shadow(0 0 26px color-mix(in srgb,var(--ac) 55%,transparent));
 animation:brillo 4.5s ease-in-out infinite,isla 8s ease-in-out infinite}
.ke-punto.con-img:hover .ke-img,.ke-punto.con-img:focus-visible .ke-img{transform:scale(1.06)}
.ke-punto.con-img.dormido .ke-img{opacity:.88;animation-name:brillo-suave,isla}
.ke-punto.con-img .ke-luz,.ke-punto.con-img.activo .ke-luz,.ke-punto.con-img.dormido .ke-luz{width:150%;height:150%;transform:translate(-50%,-50%)}
.ke-punto.con-img .ke-nom{position:absolute;top:100%;left:50%;transform:translateX(-50%);margin-top:-8px}
.ke-punto.con-img:focus-visible{outline-offset:-4px}
@keyframes brillo{
 0%,100%{filter:drop-shadow(0 0 6px color-mix(in srgb,var(--ac) 60%,transparent)) drop-shadow(0 0 18px color-mix(in srgb,var(--ac) 40%,transparent))}
 50%{filter:drop-shadow(0 0 14px color-mix(in srgb,var(--ac) 90%,transparent)) drop-shadow(0 0 44px color-mix(in srgb,var(--ac) 75%,transparent))}}
@keyframes brillo-suave{
 0%,100%{filter:drop-shadow(0 0 4px color-mix(in srgb,var(--ac) 40%,transparent)) drop-shadow(0 0 12px color-mix(in srgb,var(--ac) 25%,transparent))}
 50%{filter:drop-shadow(0 0 9px color-mix(in srgb,var(--ac) 65%,transparent)) drop-shadow(0 0 28px color-mix(in srgb,var(--ac) 50%,transparent))}}
@keyframes isla{0%,100%{translate:0 0}50%{translate:0 -7px}}
.neblina{position:fixed;inset:0;pointer-events:none;z-index:8;overflow:hidden}
.niebla{position:absolute;width:1500px;opacity:.16;filter:blur(10px)}
.n1{top:-5%;left:-40%;animation:n1 60s linear infinite}
.n2{bottom:12%;right:-40%;animation:n2 80s linear infinite}
@keyframes n1{to{transform:translateX(150vw)}}
@keyframes n2{to{transform:translateX(-150vw)}}
.particulas{position:fixed;inset:0;pointer-events:none;z-index:22}
.particulas span{position:absolute;width:4px;height:4px;border-radius:50%;background:#7be6d6;box-shadow:0 0 10px #7be6d6,0 0 18px #7be6d6;animation:flotar 10s linear infinite}
@keyframes flotar{0%{transform:translateY(120px);opacity:0}30%{opacity:1}100%{transform:translateY(-250px);opacity:0}}
#ka-ui{position:fixed;top:64px;left:50%;transform:translateX(-50%);z-index:30;width:min(88vw,340px);pointer-events:none;text-align:center}
#ka-cuadro{padding:12px 16px;border-radius:22px;background:rgba(0,0,0,.5);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.14);line-height:1.5;font-size:14px;transition:opacity .6s}
#ka-ui.baja #ka-cuadro{opacity:.0}
#pista{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);z-index:30;padding:7px 14px;border-radius:18px;background:rgba(0,0,0,.45);font-size:12.5px;pointer-events:none;transition:opacity .8s;white-space:nowrap}
.avatar-usuario{position:fixed;bottom:118px;left:16px;width:56px;height:56px;border-radius:50%;overflow:hidden;z-index:31;border:2px solid rgba(255,255,255,.45);box-shadow:0 0 22px rgba(123,230,214,.6);transition:1s ease;background:rgba(0,0,0,.3);pointer-events:none}
.avatar-usuario img{width:100%;height:100%;object-fit:cover}
.volver{position:fixed;top:14px;left:14px;z-index:50;padding:11px 16px;border:0;border-radius:20px;background:rgba(255,255,255,.88);color:#17393b;font-weight:700;cursor:pointer;font-size:14px}
.nombre-usuario{position:fixed;top:14px;right:14px;z-index:50;padding:10px 14px;border-radius:20px;background:rgba(6,20,22,.6);backdrop-filter:blur(10px);border:1px solid rgba(123,230,214,.3);font-size:13px;font-weight:600;max-width:42vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media(min-width:900px){.ke-nom{font-size:16px;padding:10px 20px}.avatar-usuario{width:68px;height:68px;bottom:100px;left:24px}#pista{bottom:84px}}
@media(prefers-reduced-motion:reduce){.niebla,.particulas span,.ke-luz,.ke-img{animation:none}}
</style>
</head>
<body>
<button class="volver" onclick="location.href='avatar.html'">← Cambiar avatar</button>
<div class="nombre-usuario" id="nombreUsuario"></div>
<div id="escena"></div>
<div class="neblina"><img src="niebla1.png" class="niebla n1" alt=""><img src="niebla2.png" class="niebla n2" alt=""></div>
<div class="particulas"></div>
<div class="avatar-usuario" id="avatarUsuario"></div>
<div id="ka-ui"><div id="ka-cuadro"><p id="ka-texto">El Tepuy Ka conecta todos los caminos del Universo. Arrastra para mirar alrededor ✨</p></div></div>
<div id="pista">↔ Arrastra para explorar</div>
<audio id="sonidoAmbiente" loop preload="auto"><source src="ka-tepuy.mp3" type="audio/mpeg"></audio>
<script src="escena-ka.js"></script>
<script>
for (var i = 0; i < 40; i++) {
  var p = document.createElement("span");
  p.style.left = Math.random() * 100 + "vw"; p.style.top = Math.random() * 100 + "vh";
  p.style.animationDuration = (5 + Math.random() * 6) + "s";
  document.querySelector(".particulas").appendChild(p);
}
var nombre = "", personaje = "";
try { nombre = localStorage.getItem("nombreAvatar") || ""; personaje = localStorage.getItem("personajeAvatar") || ""; } catch (e) {}
document.getElementById("nombreUsuario").textContent = nombre || "Viajera";
if (personaje) { var img = document.createElement("img"); img.src = personaje; img.alt = ""; document.getElementById("avatarUsuario").appendChild(img); } else document.getElementById("avatarUsuario").style.display = "none";
var ka = document.getElementById("ka-texto"), kaUi = document.getElementById("ka-ui"), pista = document.getElementById("pista"), avatar = document.getElementById("avatarUsuario");
if (nombre) ka.textContent = "Bienvenido, " + nombre + ". Arrastra para mirar alrededor: la Región de Creación te espera ✨";
setTimeout(function () { kaUi.classList.add("baja"); }, 9000);
var mundo = null;
fetch("ka-mundo.json").then(function (r) { return r.json(); }).then(function (m) {
  mundo = KaEscena.montar({
    raiz: document.getElementById("escena"), ratio: m.tepuy.imagen, ancho: 1.7, cielo: "tepuy-cielo.jpg",
    capas: [
      { src: "capa-fondo.webp", k: -.07, z: 1 },
      { src: "capa-medio.webp", k: 0, z: 2 },
      { src: "capa-frente.webp", k: .09, z: 9 }
    ],
    puntos: m.tepuy.puntos, inicio: { x: 50, y: 55 },
    alMover: function () { pista.style.opacity = 0; },
    alPunto: function (p, el) {
      kaUi.classList.remove("baja"); clearTimeout(window._t); window._t = setTimeout(function () { kaUi.classList.add("baja"); }, 6000);
      if (p.estado !== "activo") { ka.textContent = p.aviso; return; }
      var b = el.getBoundingClientRect();
      avatar.style.left = (b.left + b.width / 2) + "px"; avatar.style.top = (b.top + b.height / 2) + "px";
      avatar.style.bottom = "auto"; avatar.style.transform = "translate(-50%,-50%) scale(.8)";
      setTimeout(function () { location.href = p.destino; }, 1100);
    }
  });
  setTimeout(function () { pista.style.opacity = 0; }, 7000);
}).catch(function (e) { console.error("No se pudo cargar ka-mundo.json:", e); location.replace("region-creacion.html"); });
document.body.addEventListener("click", function () {
  var a = document.getElementById("sonidoAmbiente"); a.volume = .35; a.play().catch(function () {});
}, { once: true });
</script>
<script src="ka-nav.js" data-aqui="tepuy" data-sin-presencia></script>
<script src="pwa.js"></script>
</body>
</html>
