
<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Universo Ka — Mapa de los Maestros</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    min-height:100vh;
    background:#05080c;
    color:white;
    font-family:Segoe UI, sans-serif;
    overflow:hidden;
}

/* ==============================
   TÍTULO
============================== */

.titulo-mapa{
    position:absolute;
    top:40px;
    width:100%;
    text-align:center;
    z-index:10;
}

.titulo-mapa h1{
    font-size:42px;
    letter-spacing:8px;
}

.titulo-mapa p{
    margin-top:8px;
    opacity:.7;
}

/* ==============================
   VOLVER
============================== */

.volver{
    position:absolute;
    top:30px;
    left:30px;
    z-index:20;

    padding:10px 18px;

    border:1px solid rgba(255,255,255,.3);
    border-radius:20px;

    background:rgba(0,0,0,.4);
    color:white;

    cursor:pointer;
}

/* ==============================
   CENTRO
============================== */

.centro-mapa{
    height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;
}

/* ==============================
   PORTAL
============================== */

.contenedor-portal{
    text-align:center;
}

.portal-luz{

    width:180px;
    height:180px;

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            #fff 0%,
            #ffe89a 15%,
            #b7e8ff 35%,
            #7b72ff 55%,
            transparent 72%
        );

    box-shadow:
        0 0 30px #fff,
        0 0 70px #9c8cff,
        0 0 130px #695cff;

    cursor:pointer;

    animation:
        pulsar 3s infinite ease-in-out;

    transition:.4s;
}

.portal-luz:hover{
    transform:scale(1.08);
}

@keyframes pulsar{

    0%,100%{
        transform:scale(1);
    }

    50%{
        transform:scale(1.08);
    }

}

/* ==============================
   TEXTO
============================== */

.texto-portal{
    margin-top:25px;
}

.texto-portal h2{
    font-size:26px;
}

.texto-portal p{
    margin-top:8px;
    opacity:.7;
}

/* ==============================
   MENSAJE DE CONEXIÓN
============================== */

#mensajeConexion{

    display:none;

    position:fixed;

    inset:0;

    align-items:center;
    justify-content:center;

    background:rgba(0,0,0,.85);

    z-index:90;

    font-size:22px;
}

</style>

</head>

<body>

<!-- TÍTULO -->

<div class="titulo-mapa">

    <h1>UNIVERSO KA</h1>

    <p>El Mapa de los Maestros</p>

</div>


<!-- VOLVER -->

<button
    class="volver"
    onclick="volverAtras()">

    ← Volver

</button>


<!-- CENTRO -->

<div class="centro-mapa">

    <div class="contenedor-portal">

        <div
            class="portal-luz"
            onclick="abrirPortal()">
        </div>

        <div class="texto-portal">

            <h2>Portal de Lira</h2>

            <p>
                Entra al corazón del conocimiento
            </p>

        </div>

    </div>

</div>


<!-- MENSAJE DE CONEXIÓN -->

<div id="mensajeConexion">

    Conectando con Lira... 🧚‍♀️

</div>


<script>

/* =========================================
   URL DEL PORTAL REAL DE LIRA
========================================= */

/*
   PEGA AQUÍ LA URL /exec DE TU NUEVO
   PROYECTO DE APPS SCRIPT.


*/

const PORTAL_LIRA =
    "https://script.google.com/macros/s/AKfycbxN3vS1Vc9BjRPY75GMm1RFqMKGnsCY5lxXToGmEUTGQTeWJebUClcOCHV9P2rxYd_S/exec";


/* =========================================
   ABRIR PORTAL
========================================= */

function abrirPortal(){

    const mensaje =
        document.getElementById(
            "mensajeConexion"
        );

    mensaje.style.display = "flex";


    setTimeout(function(){

        window.location.href =
            PORTAL_LIRA;

    },700);

}


/* =========================================
   VOLVER
========================================= */

function volverAtras(){

    window.history.back();

}


console.log(
    "🌌 Mapa de Universo Ka preparado"
);

</script>

</body>

</html>
