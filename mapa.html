<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tepuy Central – Universo Ka</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',system-ui,sans-serif}
body{overflow:hidden;height:100vh;height:100dvh;color:#fff;background:linear-gradient(rgba(0,0,0,.35),rgba(0,0,0,.78)),url("tepuy-fondo.jpg") center/cover no-repeat,#0b1d1f}
.mapa{position:relative;width:100vw;height:100vh;height:100dvh;overflow:hidden}
.neblina{position:absolute;inset:0;pointer-events:none;z-index:1;overflow:hidden}
.niebla{position:absolute;width:1500px;opacity:.14;filter:blur(10px)}
.n1{top:-10%;left:-40%;animation:n1 50s linear infinite}
.n2{bottom:-10%;right:-40%;animation:n2 65s linear infinite}
@keyframes n1{to{transform:translateX(150vw)}}
@keyframes n2{to{transform:translateX(-150vw)}}
.particulas{position:absolute;inset:0;pointer-events:none;z-index:2}
.particulas span{position:absolute;width:4px;height:4px;border-radius:50%;background:#7be6d6;box-shadow:0 0 10px #7be6d6,0 0 18px #7be6d6;animation:flotar 10s linear infinite}
@keyframes flotar{0%{transform:translateY(120px);opacity:0}30%{opacity:1}100%{transform:translateY(-250px);opacity:0}}
.portal-central{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:560px;height:560px;background:url("tepuy-ka.png") center/contain no-repeat;z-index:3;animation:respirar 6s ease-in-out infinite;filter:drop-shadow(0 0 25px rgba(80,255,240,.5)) drop-shadow(0 0 60px rgba(80,255,240,.8)) drop-shadow(0 0 120px rgba(80,255,240,.35))}
@keyframes respirar{0%,100%{transform:translate(-50%,-50%) scale(1)}50%{transform:translate(-50%,-50%) scale(1.04)}}
.region{position:absolute;width:220px;height:220px;cursor:pointer;z-index:5;transition:.4s;animation:flotarR 6s ease-in-out infinite}
.region::before{content:"";position:absolute;inset:0;background-size:contain,70% 70%;background-repeat:no-repeat;background-position:center;filter:drop-shadow(0 0 28px rgba(123,230,214,.45));transition:.4s}
.region:hover{transform:scale(1.06)}
.region:hover::before{filter:drop-shadow(0 0 45px rgba(123,230,214,.85))}
@keyframes flotarR{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.nombre-region{position:absolute;bottom:-10px;left:50%;transform:translateX(-50%);font-size:14px;font-weight:600;text-shadow:0 0 12px rgba(123,230,214,.6);background:rgba(0,0,0,.35);padding:8px 14px;border-radius:20px;backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.1);white-space:nowrap;text-align:center}
.nombre-region small{display:block;font-weight:400;font-size:11px;opacity:.75}
.region.dormida::before{filter:grayscale(.7) brightness(.7) drop-shadow(0 0 14px rgba(123,230,214,.25))}
.region.dormida{animation:none}
.region.viva-abierta .nombre-region{border-color:rgba(255,229,143,.6);box-shadow:0 0 22px rgba(255,229,143,.35)}
.r1{top:8%;left:6%}.r2{top:12%;right:6%}.r3{bottom:calc(13% + 60px);left:50%;transform:translateX(-50%)}
.r3:hover{transform:translateX(-50%) scale(1.06)}
.r1::before{background-image:url("region-viva.png"),radial-gradient(circle,rgba(0,255,200,.55),transparent 68%)}
.r2::before{background-image:url("region-espiritual.png"),radial-gradient(circle,rgba(130,170,255,.55),transparent 68%)}
.r3::before{background-image:url("region-creacion.png"),radial-gradient(circle,rgba(255,229,143,.6),transparent 68%)}
#ka-ui{position:absolute;top:13%;left:50%;transform:translateX(-50%);z-index:20;text-align:center;pointer-events:none}
#ka-luz{width:80px;height:80px;margin:auto;border-radius:50%;background:radial-gradient(circle,#7be6d6,transparent);box-shadow:0 0 40px #7be6d6;animation:pulsar 3s infinite}
@keyframes pulsar{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
#ka-cuadro{margin-top:12px;width:290px;padding:14px;border-radius:26px;background:rgba(0,0,0,.4);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.12);line-height:1.6;font-size:14px}
.avatar-usuario{position:absolute;bottom:112px;left:50%;transform:translateX(-50%);width:82px;height:82px;border-radius:50%;overflow:hidden;z-index:25;border:2px solid rgba(255,255,255,.4);box-shadow:0 0 25px rgba(123,230,214,.6);transition:1s ease;background:rgba(0,0,0,.3)}
.avatar-usuario img{width:100%;height:100%;object-fit:cover}
.nombre-usuario{position:absolute;bottom:86px;left:50%;transform:translateX(-50%);font-size:14px;font-weight:600;z-index:25;text-shadow:0 0 10px rgba(123,230,214,.5)}
.volver{position:fixed;top:16px;left:16px;z-index:50;padding:11px 16px;border:0;border-radius:20px;background:rgba(255,255,255,.85);color:#17393b;font-weight:700;cursor:pointer}
@media(max-width:768px){
.portal-central{width:250px;height:250px}
.region{width:150px;height:150px}
.nombre-region{font-size:11px;padding:6px 10px}
.r1{top:20%;left:-1%}.r2{top:20%;right:-1%}.r3{bottom:calc(15% + 70px)}
#ka-ui{top:9%;transform:translateX(-50%) scale(.82)}
.avatar-usuario{width:62px;height:62px}
}
</style>
</head>
<body>
<button class="volver" onclick="location.href='avatar.html'">← Cambiar avatar</button>
<div class="mapa">
  <div class="neblina"><img src="niebla1.png" class="niebla n1" alt=""><img src="niebla2.png" class="niebla n2" alt=""></div>
  <div class="particulas"></div>
  <div class="portal-central"></div>

  <div class="region r1 dormida" data-destino="" data-aviso="La Región Viva aún duerme… pronto despertará con sus guardianes y su bosque ✨">
    <div class="nombre-region">Región Viva<small>pronto</small></div></div>
  <div class="region r2 dormida" data-destino="" data-aviso="La Región Espiritual guarda sus memorias… todavía no se abre ✨">
    <div class="nombre-region">Región Espiritual<small>pronto</small></div></div>
  <div class="region r3 viva-abierta" data-destino="region-creacion.html">
    <div class="nombre-region">Región de Creación<small>islas para crear</small></div></div>

  <div class="avatar-usuario" id="avatarUsuario"></div>
  <div class="nombre-usuario" id="nombreUsuario"></div>

  <div id="ka-ui"><div id="ka-luz"></div><div id="ka-cuadro"><p id="ka-texto">El Tepuy Central conecta todos los caminos del Universo Ka. La Región de Creación te espera ✨</p></div></div>
</div>
<audio id="sonidoAmbiente" loop preload="auto"><source src="ka-tepuy.mp3" type="audio/mpeg"></audio>
<script>
for (var i = 0; i < 50; i++) {
  var p = document.createElement("span");
  p.style.left = Math.random() * 100 + "vw"; p.style.top = Math.random() * 100 + "vh";
  p.style.animationDuration = (5 + Math.random() * 6) + "s";
  document.querySelector(".particulas").appendChild(p);
}
var nombre = "", personaje = "";
try { nombre = localStorage.getItem("nombreAvatar") || ""; personaje = localStorage.getItem("personajeAvatar") || ""; } catch (e) {}
document.getElementById("nombreUsuario").textContent = nombre || "Viajera";
if (personaje) { var img = document.createElement("img"); img.src = personaje; img.alt = ""; document.getElementById("avatarUsuario").appendChild(img); }
if (nombre) document.getElementById("ka-texto").textContent = "Bienvenido, " + nombre + ". El Tepuy Central conecta todos los caminos. La Región de Creación te espera ✨";

var avatar = document.getElementById("avatarUsuario"), ka = document.getElementById("ka-texto");
Array.prototype.forEach.call(document.querySelectorAll(".region"), function (r) {
  r.addEventListener("click", function () {
    if (!r.dataset.destino) { ka.textContent = r.dataset.aviso; return; }
    var b = r.getBoundingClientRect();
    avatar.style.left = (b.left + b.width / 2) + "px"; avatar.style.top = (b.top + b.height / 2) + "px";
    avatar.style.bottom = "auto"; avatar.style.transform = "translate(-50%,-50%) scale(.8)";
    setTimeout(function () { location.href = r.dataset.destino; }, 1200);
  });
});
document.body.addEventListener("click", function () {
  var a = document.getElementById("sonidoAmbiente"); a.volume = .35; a.play().catch(function () {});
}, { once: true });
</script>
<script src="ka-nav.js" data-aqui="tepuy" data-sin-presencia></script>
<script src="pwa.js"></script>
</body>
</html>
