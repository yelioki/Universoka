<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Todos los lugares – Universo Ka</title>
<link rel="stylesheet" href="editor-ka.css">
<style>
.lista{display:grid;gap:12px}
.t{display:flex;gap:14px;align-items:center;padding:16px;text-align:left;width:100%;text-decoration:none;color:#fff;border-radius:22px}
.t .ico{font-size:34px;width:54px;height:54px;flex:0 0 54px;display:grid;place-items:center;background:rgba(255,255,255,.1);border-radius:16px}
.t b{display:block;font-size:17px}
.t small{display:block;opacity:.85;line-height:1.45;margin-top:3px;font-size:13px}
.t .num{font-size:11px;letter-spacing:1.5px;color:#7be6d6;text-transform:uppercase}
.t.pronto{opacity:.6}.t{font:inherit;border:0;cursor:pointer}.t b{font-size:17px}
.t:not(.pronto):hover{outline:2px solid #7be6d6}
.tag{display:inline-block;margin-left:6px;padding:2px 8px;border-radius:10px;background:rgba(255,229,143,.2);color:#ffe58f;font-size:11px;font-weight:700}
</style>
</head>
<body>
<button class="volver" onclick="location.href='region-creacion.html'">← Región de Creación</button>
<div class="neblina"><img src="niebla1.png" class="niebla n1" alt=""><img src="niebla2.png" class="niebla n2" alt=""></div>
<main>
  <h1>Todos los lugares</h1>
  <p class="sub">La Región de Creación en lista, por si prefieres ir directo.<br>Cada lugar tiene sus propias herramientas.</p>
  <div class="lista" id="lista"></div>
</main>
<script>
function esc(t){return String(t).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
fetch("ka-mundo.json").then(function(r){return r.json()}).then(function(m){
  var cont=document.getElementById("lista");
  m.lugares.concat((m.aparte||[]).map(function(a){return {nombre:a.nombre,tipo:"Crear",detalle:a.lema,emblema:a.emblema,estado:"activo",destino:a.destino}})).forEach(function(l){
    var act=l.estado==="activo", e=document.createElement(act?"a":"button");
    e.className="glass t"+(act?"":" pronto");
    if(act)e.href=l.destino;else{e.type="button";e.onclick=function(){window.KaNav&&KaNav.avisar(l.aviso)}}
    e.innerHTML='<span class="ico">'+l.emblema+'</span><span><span class="num">'+esc(l.tipo)+'</span><b>'+esc(l.nombre)+'</b><small>'+esc(l.detalle)+'</small></span>';
    cont.appendChild(e);
  });
}).catch(function(){document.getElementById("lista").innerHTML='<p class="sub">No pude cargar la lista. <a href="region-creacion.html" style="color:#7be6d6">Volver a la Región de Creación</a></p>'});
</script>
<script src="ka-nav.js" data-aqui="creacion"></script>

<script src="pwa.js"></script>
</body>
</html>
