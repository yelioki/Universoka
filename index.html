<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Universo Ka — El Llamado</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  overflow:hidden;
  background:black;
  font-family:'Segoe UI',sans-serif;
}

.escena{
  position:relative;
  width:100%;
  height:100vh;
  overflow:hidden;
}

/* VIDEO */

#video-fondo{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  filter:
  brightness(0.42)
  saturate(0.8);
  z-index:1;
}

/* OSCURECER */

.escena::after{

  content:"";

  position:absolute;
  inset:0;

  background:
  linear-gradient(
  to bottom,
  rgba(0,0,0,0.15),
  rgba(0,0,0,0.45),
  rgba(0,0,0,0.82));

  z-index:2;
}

/* BRILLO */

.brillo{

  position:absolute;
  inset:0;

  background:
  radial-gradient(
  circle at center,
  rgba(255,215,0,0.06),
  transparent 60%);

  z-index:3;

  animation:respirar 8s ease-in-out infinite;
}

@keyframes respirar{

  0%{opacity:0.3;}
  50%{opacity:0.7;}
  100%{opacity:0.3;}
}

/* NIEBLA */

.neblina{
  position:absolute;
  inset:0;
  overflow:hidden;
  z-index:4;
  pointer-events:none;
}

.niebla{

  position:absolute;
  width:1900px;

  opacity:0.15;

  filter:blur(10px);

  animation:moverNiebla 80s linear infinite;
}

@keyframes moverNiebla{

  0%{
    transform:translateX(-40%);
  }

  100%{
    transform:translateX(120%);
  }
}

/* PARTICULAS */

.particulas{
  position:absolute;
  inset:0;
  z-index:5;
}

.particulas span{

  position:absolute;

  width:3px;
  height:3px;

  border-radius:50%;

  background:rgba(255,255,255,0.35);

  animation:flotar 12s linear infinite;
}

@keyframes flotar{

  0%{
    transform:translateY(120px);
    opacity:0;
  }

  20%{
    opacity:0.4;
  }

  100%{
    transform:translateY(-220px);
    opacity:0;
  }
}

/* LUCIERNAGA */

.luciernaga{

  position:absolute;

  top:48%;
  left:50%;

  transform:translate(-50%,-50%);

  width:16px;
  height:16px;

  border-radius:50%;

  background:#ffe58f;

  box-shadow:
  0 0 12px #ffe58f,
  0 0 30px #ffd700,
  0 0 60px rgba(255,215,0,0.5);

  z-index:10;

  pointer-events:none;

  opacity:0.7;

  animation:
  parpadearSuave 6s ease-in-out infinite,
  flotarLuz 6s ease-in-out infinite;
}

/* ACTIVACION */

.luciernaga.activa{

  pointer-events:auto;

  cursor:pointer;

  animation:
  pulsarKa 1.5s ease-in-out infinite,
  flotarLuz 5s ease-in-out infinite;
}

.luciernaga.activa:hover{

  transform:
  translate(-50%,-50%)
  scale(1.3);
}

/* TEXTO GUIA */

#guia{

  position:absolute;

  top:41%;
  left:50%;

  transform:translateX(-50%);

  width:320px;

  text-align:center;

  color:#f7f4e8;

  font-size:16px;

  letter-spacing:1px;

  line-height:1.5;

  opacity:0;

  z-index:20;

  text-shadow:
    0 0 12px rgba(255,255,255,0.35);

  transition:1.5s;
}

#guia.visible{
  opacity:0.7;
}

/* ANIMACIONES */

@keyframes parpadearSuave{

  0%{
    opacity:0.3;
  }

  50%{
    opacity:0.7;
  }

  100%{
    opacity:0.3;
  }
}

@keyframes pulsarKa{

  0%{
    transform:translate(-50%,-50%) scale(0.9);

    box-shadow:
    0 0 10px #ffe58f,
    0 0 25px #ffd700,
    0 0 45px rgba(255,215,0,0.4);
  }

  50%{
    transform:translate(-50%,-50%) scale(1.35);

    box-shadow:
    0 0 25px #fff4b0,
    0 0 55px #ffd700,
    0 0 120px rgba(255,215,0,0.9);
  }

  100%{
    transform:translate(-50%,-50%) scale(0.9);

    box-shadow:
    0 0 10px #ffe58f,
    0 0 25px #ffd700,
    0 0 45px rgba(255,215,0,0.4);
  }
}

@keyframes flotarLuz{

  0%{margin-top:0px;}
  50%{margin-top:-20px;}
  100%{margin-top:0px;}
}

/* MENSAJE */

#mensaje{

  position:absolute;

  bottom:16%;

  left:50%;

  transform:translateX(-50%);

  width:85%;
  max-width:760px;

  text-align:center;

  color:white;

  font-size:24px;

  line-height:1.8;

  z-index:20;

  opacity:0;

  text-shadow:
  0 0 20px rgba(255,255,255,0.15);

  animation:aparecer 4s ease forwards;
  animation-delay:3s;
}

@keyframes aparecer{

  to{
    opacity:1;
  }
}

@media(max-width: 768px){
  #mensaje {
    font-size: 17px; /* Más pequeño y cómodo en el cel */
    bottom: 12%;     /* Lo subes un poquito para que no choque con el borde */
    line-height: 1.6;
  }
  #guia {
    font-size: 14px;
    width: 260px;
  }
}
</style>
</head>

<body>

<div class="escena">

<!-- VIDEO -->

<video autoplay muted loop playsinline id="video-fondo">

  <source src="mundo-real.mp4" type="video/mp4">

</video>

<!-- BRILLO -->

<div class="brillo"></div>

<!-- NIEBLA -->

<div class="neblina">

  <img src="niebla1.png" class="niebla">

</div>

<!-- PARTICULAS -->

<div class="particulas"></div>

<!-- LUCIERNAGA -->

<div class="luciernaga" id="luz"></div>

<!-- GUIA -->

<div id="guia">

  Sigue la chispa...

</div>

<!-- MENSAJE -->

<div id="mensaje">

El mundo continuó avanzando...<br>

pero algo en tu interior seguía buscando.<br><br>

<span class="segunda-frase">

No era un lugar.<br>

Era una forma de volver a crear.

</span>

</div>

<!-- AUDIO -->

<audio loop id="ambiente">

  <source src="llamado-ka.mp3" type="audio/mpeg">

</audio>

</div> <!-- CIERRA LA ESCENA -->

<script>

/* PARTICULAS */

const contenedor =
document.querySelector('.particulas');

for(let i=0;i<35;i++){

  let p =
  document.createElement('span');

  p.style.left =
  Math.random()*100+'vw';

  p.style.top =
  Math.random()*100+'vh';

  p.style.animationDuration =
  (8+Math.random()*10)+'s';

  contenedor.appendChild(p);
}

/* AUDIO */

const audio =
document.getElementById("ambiente");

audio.volume = 0.45;

document.body.addEventListener("click", () => {

  audio.play();

}, { once:true });

/* ACTIVAR LUZ */

const luz =
document.getElementById("luz");

const guia =
document.getElementById("guia");

setTimeout(() => {

  luz.classList.add("activa");

  guia.classList.add("visible");

  luz.onclick = function(){

    window.location.href =
    "transicion.html";
  };

}, 9000);

</script>

</body>
</html>
