<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Región de Creación – Universo Ka</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',system-ui,sans-serif}
html,body{min-height:100%}
body{color:#fff;overflow-x:hidden;background:linear-gradient(rgba(0,0,0,.35),rgba(0,0,0,.78)) fixed,url("fondo-creacion.jpg") center/cover fixed,url("tepuy-fondo.jpg") center/cover fixed,#0b1d1f}
.neblina{position:fixed;inset:0;pointer-events:none;z-index:1;overflow:hidden}
.niebla{position:absolute;width:1400px;opacity:.12;filter:blur(10px)}
.n1{top:-10%;left:-40%;animation:n1 50s linear infinite}
.n2{bottom:-10%;right:-40%;animation:n2 65s linear infinite}
@keyframes n1{to{transform:translateX(150vw)}}
@keyframes n2{to{transform:translateX(-150vw)}}
.particulas{position:fixed;inset:0;pointer-events:none;z-index:2}
.particulas span{position:absolute;width:4px;height:4px;border-radius:50%;background:#66fff2;box-shadow:0 0 10px #66fff2,0 0 20px #66fff2;animation:flotar 10s linear infinite}
@keyframes flotar{0%{transform:translateY(120px);opacity:0}30%{opacity:1}100%{transform:translateY(-260px);opacity:0}}
.volver{position:fixed;top:14px;left:14px;z-index:70;padding:11px 16px;border:0;border-radius:20px;background:rgba(255,255,255,.9);color:#17393b;font-weight:700;cursor:pointer;font-size:14px}
main{position:relative;z-index:10;max-width:1000px;margin:0 auto;padding:74px 16px 30px}
h1{font-size:32px;text-align:center;text-shadow:0 0 18px rgba(255,229,143,.5)}
.sub{text-align:center;max-width:520px;margin:8px auto 4px;line-height:1.6;opacity:.92;font-size:15px}
.lista-link{display:block;text-align:center;color:#7be6d6;font-size:13px;margin-bottom:6px;padding:8px}
.archi{display:grid;grid-template-columns:repeat(2,1fr);gap:6px 10px;margin-top:10px}
.lugar{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;align-items:center;text-align:center;padding:4px 4px 12px;border-radius:26px;color:#fff;-webkit-tap-highlight-color:transparent;transition:transform .3s}
.lugar:nth-child(even){margin-top:34px}
.lugar:focus-visible{outline:2px solid #7be6d6}
.lugar:hover .isla,.lugar:focus-visible .isla{transform:translateY(-6px) scale(1.04)}
.isla{position:relative;width:170px;height:150px;transition:transform .4s;animation:flota 6s ease-in-out infinite}
.lugar:nth-child(2n) .isla{animation-delay:-2s}.lugar:nth-child(3n) .isla{animation-delay:-4s}
@keyframes flota{0%,100%{translate:0 0}50%{translate:0 -8px}}
.isla .roca{position:absolute;left:50%;bottom:0;width:126px;height:74px;transform:translateX(-50%);background:linear-gradient(#6a7a74,#25302e);clip-path:polygon(0 0,100% 0,84% 50%,62% 100%,42% 66%,20% 50%)}
.isla .tope{position:absolute;left:50%;bottom:50px;width:150px;height:44px;transform:translateX(-50%);border-radius:50%;background:radial-gradient(ellipse at 50% 28%,color-mix(in srgb,var(--ac) 55%,#7be6a0),#2b7a5c 70%);box-shadow:0 0 34px color-mix(in srgb,var(--ac) 55%,transparent)}
.isla .casc{position:absolute;left:58%;bottom:6px;width:5px;height:60px;border-radius:3px;background:linear-gradient(#bffcf5,rgba(102,255,242,0));opacity:.8;animation:casc 2.4s ease-in-out infinite}
@keyframes casc{50%{opacity:.35}}
.isla .emb{position:absolute;left:50%;bottom:62px;transform:translateX(-50%);font-size:62px;line-height:1;filter:drop-shadow(0 8px 8px rgba(0,0,0,.5))}
.isla .halo{position:absolute;left:50%;bottom:48px;width:140px;height:90px;transform:translateX(-50%);border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--ac) 45%,transparent),transparent 70%);filter:blur(8px)}
.nom{font-size:16px;font-weight:700;margin-top:4px;text-shadow:0 0 12px color-mix(in srgb,var(--ac) 60%,transparent)}
.tipo{display:inline-block;margin-top:5px;padding:3px 11px;border-radius:12px;font-size:11px;font-weight:700;letter-spacing:.5px;color:var(--ac);border:1px solid color-mix(in srgb,var(--ac) 60%,transparent);background:rgba(0,0,0,.35)}
.lema{font-size:12.5px;line-height:1.4;opacity:.85;margin-top:6px;max-width:190px}
.lugar.pronto .isla,.lugar.dormido .isla{filter:saturate(.45) brightness(.8)}
.lugar.dormido{opacity:.7}
.lugar.dormido .isla{animation:none}
.aparte{margin:26px auto 0;max-width:420px;display:flex;gap:12px;align-items:center;padding:14px 18px;border-radius:22px;background:rgba(0,0,0,.4);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.12);color:#fff;text-decoration:none}
.aparte .e{font-size:28px}.aparte b{display:block}.aparte small{opacity:.8;font-size:13px}
.err{text-align:center;margin:30px 0;line-height:1.7}.err a{color:#7be6d6}
@media(min-width:700px){.archi{grid-template-columns:repeat(4,1fr);gap:12px 18px;margin-top:22px}.lugar:nth-child(even){margin-top:0}.lugar:nth-child(2n+1){margin-top:0}.lugar:nth-child(4n+2),.lugar:nth-child(4n+4){margin-top:34px}h1{font-size:40px}}
@media(prefers-reduced-motion:reduce){.isla,.casc,.niebla,.particulas span{animation:none}}
</style>
</head>
<body>
<button class="volver" onclick="location.href='mapa.html'">← Tepuy Ka</button>
<div class="neblina"><img src="niebla1.png" class="niebla n1" alt=""><img src="niebla2.png" class="niebla n2" alt=""></div>
<div class="particulas"></div>
<main>
  <h1>Región de Creación</h1>
  <p class="sub">Aquí las ideas se vuelven objetos reales. Cada isla es un lugar distinto: toca la que necesitas ✨</p>
  <a class="lista-link" href="talleres.html">Ver todo en lista</a>
  <div class="archi" id="archi" role="list"></div>
  <div id="aparte"></div>
</main>
<audio id="sonidoAmbiente" loop preload="auto"><source src="ka-tepuy.mp3" type="audio/mpeg"></audio>
<script>
for (var i = 0; i < 30; i++) { var s = document.createElement("span"); s.style.left = Math.random()*100+"vw"; s.style.top = Math.random()*100+"vh"; s.style.animationDuration = (5+Math.random()*5)+"s"; document.querySelector(".particulas").appendChild(s); }
function esc(t) { return String(t).replace(/[&<>"]/g, function (c) { return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }
fetch("ka-mundo.json").then(function (r) { return r.json(); }).then(function (m) {
  var cont = document.getElementById("archi");
  m.lugares.forEach(function (l) {
    var activo = l.estado === "activo";
    var e = document.createElement(activo ? "a" : "button");
    e.className = "lugar " + l.estado; e.setAttribute("role", "listitem");
    e.style.setProperty("--ac", l.acento);
    if (activo) e.href = l.destino; else { e.type = "button"; e.onclick = function () { window.KaNav && KaNav.avisar(l.aviso); }; }
    e.innerHTML = '<div class="isla"><i class="halo"></i><i class="roca"></i><i class="casc"></i><i class="tope"></i><span class="emb" aria-hidden="true">' + l.emblema + '</span></div>' +
      '<span class="nom">' + esc(l.nombre) + '</span><span class="tipo">' + esc(l.tipo) + '</span><span class="lema">' + esc(l.lema) + '</span>';
    cont.appendChild(e);
  });
  (m.aparte || []).forEach(function (a) {
    document.getElementById("aparte").innerHTML += '<a class="aparte" href="' + a.destino + '"><span class="e">' + a.emblema + '</span><span><b>' + esc(a.nombre) + '</b><small>' + esc(a.lema) + '</small></span></a>';
  });
}).catch(function () {
  document.getElementById("archi").outerHTML = '<p class="err">No pude abrir el mapa de islas. <a href="talleres.html">Ver la lista</a></p>';
});
</script>
<script>document.body.addEventListener("click",function(){var a=document.getElementById("sonidoAmbiente");a.volume=.35;a.play().catch(function(){})},{once:true});</script>
<script src="ka-nav.js" data-aqui="creacion"></script>
<script src="pwa.js"></script>
</body>
</html>
