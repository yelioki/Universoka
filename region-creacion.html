<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Región de Creación – Universo Ka</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',system-ui,sans-serif}
body{overflow:hidden;height:100vh;height:100dvh;color:#fff;background:linear-gradient(rgba(0,0,0,.35),rgba(0,0,0,.78)),url("fondo-creacion.jpg") center/cover,url("tepuy-fondo.jpg") center/cover,#0b1d1f}
.region-creacion{position:relative;width:100vw;height:100vh;height:100dvh;overflow:hidden}
.neblina{position:absolute;inset:0;pointer-events:none;z-index:1;overflow:hidden}
.niebla{position:absolute;width:1400px;opacity:.12;filter:blur(10px)}
.n1{top:-10%;left:-40%;animation:n1 50s linear infinite}
.n2{bottom:-10%;right:-40%;animation:n2 65s linear infinite}
@keyframes n1{to{transform:translateX(150vw)}}
@keyframes n2{to{transform:translateX(-150vw)}}
.particulas{position:absolute;inset:0;pointer-events:none;z-index:2}
.particulas span{position:absolute;width:4px;height:4px;border-radius:50%;background:#66fff2;box-shadow:0 0 10px #66fff2,0 0 20px #66fff2;animation:flotar 10s linear infinite}
@keyframes flotar{0%{transform:translateY(120px);opacity:0}30%{opacity:1}100%{transform:translateY(-260px);opacity:0}}
.energia{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:300px;height:300px;border-radius:50%;background:radial-gradient(circle,rgba(102,255,242,.35),transparent 70%);filter:blur(10px);animation:pulsarE 5s ease-in-out infinite}
@keyframes pulsarE{0%,100%{transform:translate(-50%,-50%) scale(1);opacity:.7}50%{transform:translate(-50%,-50%) scale(1.08);opacity:1}}
.lugar{position:absolute;width:300px;height:300px;cursor:pointer;z-index:5;transition:.4s;animation:resp 6s ease-in-out infinite}
.lugar::before{content:"";position:absolute;inset:0;background-size:contain,70% 70%;background-repeat:no-repeat;background-position:center;filter:drop-shadow(0 0 25px rgba(102,255,242,.4));transition:.4s}
.lugar:hover{transform:scale(1.06)}
.lugar:hover::before{filter:drop-shadow(0 0 50px rgba(102,255,242,.9))}
@keyframes resp{0%,100%{translate:0 0}50%{translate:0 -8px}}
.atelier{top:14%;left:7%}.lienzo{top:14%;right:7%}.forja{bottom:11%;left:50%;transform:translateX(-50%)}.forja:hover{transform:translateX(-50%) scale(1.06)}
.atelier::before{background-image:url("atelier-yelioki.png"),radial-gradient(circle,rgba(255,229,143,.6),transparent 68%)}
.forja::before{background-image:url("forja-astral.png"),radial-gradient(circle,rgba(102,255,242,.5),transparent 68%)}
.lienzo::before{background-image:url("lienzo-ka.png"),radial-gradient(circle,rgba(232,140,160,.6),transparent 68%)}
.lienzo .nombre{border-color:rgba(255,160,180,.6);box-shadow:0 0 22px rgba(255,160,180,.3)}
.forja{opacity:.7}.forja::before{filter:grayscale(.6) brightness(.8)}
.nombre{position:absolute;bottom:-10px;left:50%;transform:translateX(-50%);padding:10px 18px;border-radius:22px;background:rgba(0,0,0,.4);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.1);font-size:14px;font-weight:600;white-space:nowrap;text-align:center;text-shadow:0 0 12px rgba(102,255,242,.5)}
.nombre small{display:block;font-weight:400;font-size:11px;opacity:.75}
.atelier .nombre{border-color:rgba(255,229,143,.6);box-shadow:0 0 22px rgba(255,229,143,.3)}
.ka-ui{position:absolute;bottom:6%;left:50%;transform:translateX(-50%);z-index:20;text-align:center;width:min(92vw,330px)}
.ka-luz{width:60px;height:60px;margin:auto;border-radius:50%;background:radial-gradient(circle,#66fff2,transparent);box-shadow:0 0 40px #66fff2;animation:pulsarK 3s infinite}
@keyframes pulsarK{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.ka-cuadro{margin-top:10px;padding:14px;border-radius:24px;background:rgba(0,0,0,.4);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.1);line-height:1.6;font-size:14px}
.volver{position:fixed;top:16px;left:16px;z-index:50;padding:11px 16px;border:0;border-radius:20px;background:rgba(255,255,255,.9);color:#17393b;font-weight:700;cursor:pointer}
@media(max-width:768px){.lugar{width:210px;height:210px}.atelier{top:13%;left:-3%}.lienzo{top:13%;right:-3%}.forja{bottom:25%}.nombre{font-size:12px;padding:8px 12px}}
</style>
</head>
<body>
<button class="volver" onclick="location.href='mapa.html'">← Volver al Tepuy</button>
<div class="region-creacion">
  <div class="neblina"><img src="niebla1.png" class="niebla n1" alt=""><img src="niebla2.png" class="niebla n2" alt=""></div>
  <div class="particulas"></div>
  <div class="energia"></div>
  <div class="lugar atelier" data-destino="atelier-yelioki.html"><div class="nombre">Atelier Yelioki<small>abierto</small></div></div>
  <div class="lugar lienzo" data-destino="talleres.html"><div class="nombre">Lienzo de Ka<small>talleres para crear</small></div></div>
  <div class="lugar forja" data-aviso="La Forja Astral aún está encendiéndose… pronto abrirá sus puertas 🔥"><div class="nombre">Forja Astral<small>pronto</small></div></div>
  <div class="ka-ui"><div class="ka-luz"></div><div class="ka-cuadro"><p id="ka-texto">Aquí nacen las creaciones vivas del Universo Ka. Entra al Atelier, o toma el Lienzo y crea lo tuyo ✨</p></div></div>
</div>
<audio id="sonidoAmbiente" loop preload="auto"><source src="bosque.mp3" type="audio/mpeg"></audio>
<script>
for (var i = 0; i < 40; i++) { var s = document.createElement("span"); s.style.left = Math.random()*100+"vw"; s.style.top = Math.random()*100+"vh"; s.style.animationDuration = (5+Math.random()*5)+"s"; document.querySelector(".particulas").appendChild(s); }
Array.prototype.forEach.call(document.querySelectorAll(".lugar"), function (l) {
  l.addEventListener("click", function () {
    if (l.dataset.destino) location.href = l.dataset.destino;
    else document.getElementById("ka-texto").textContent = l.dataset.aviso;
  });
});
document.body.addEventListener("click", function () { var a = document.getElementById("sonidoAmbiente"); a.volume = .35; a.play().catch(function(){}); }, { once: true });
</script>
<script src="pwa.js"></script>
</body>
</html>
