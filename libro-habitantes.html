<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Libro de los Habitantes – Círculo Ka</title>
<link rel="stylesheet" href="editor-ka.css">
<style>
main{max-width:680px}
.perfil-cabecera{display:flex;gap:18px;align-items:center;margin-bottom:20px}
.perfil-avatar{width:90px;height:90px;border-radius:50%;overflow:hidden;border:3px solid rgba(123,230,214,.4);box-shadow:0 0 24px rgba(123,230,214,.3);flex-shrink:0}
.perfil-avatar img{width:100%;height:100%;object-fit:cover}
.perfil-datos h2{font-size:22px;margin-bottom:4px;color:#7be6d6}
.perfil-datos .guardia{font-size:13px;opacity:.7;font-style:italic}
.perfil-presentacion{font-size:14px;line-height:1.6;opacity:.85;margin-top:8px;white-space:pre-wrap}
.perfil-creado{font-size:11px;opacity:.5;margin-top:8px}
.panel-editar{padding:20px;border-radius:24px}
.panel-editar .campo{margin-bottom:14px}
.panel-editar label{display:block;margin-bottom:5px;font-size:11px;letter-spacing:1px;text-transform:uppercase;opacity:.6}
.panel-editar input,.panel-editar textarea,.panel-editar select{width:100%;padding:12px 14px;border-radius:16px;border:1px solid rgba(123,230,214,.25);background:rgba(30,120,125,.35);color:#fff;font-family:inherit;font-size:14px;outline:none}
.panel-editar input:focus,.panel-editar textarea:focus,.panel-editar select:focus{border-color:rgba(123,230,214,.7)}
.panel-editar textarea{min-height:80px;resize:vertical}
.avatares{display:flex;gap:10px;flex-wrap:wrap}
.avatares button{width:54px;height:54px;border-radius:50%;border:2px solid transparent;padding:0;cursor:pointer;overflow:hidden;background:none}
.avatares button img{width:100%;height:100%;object-fit:cover}
.avatares button.on{border-color:#7be6d6;box-shadow:0 0 14px rgba(123,230,214,.5)}
.habitantes-lista{margin-top:20px}
.habitante-card{display:flex;gap:12px;align-items:center;padding:14px;margin-bottom:10px;border-radius:18px;background:rgba(0,0,0,.3);border:1px solid rgba(255,255,255,.06);transition:.3s;cursor:pointer}
.habitante-card:hover{background:rgba(0,0,0,.45);border-color:rgba(123,230,214,.3)}
.habitante-card img{width:44px;height:44px;border-radius:50%;border:1px solid rgba(123,230,214,.3)}
.habitante-card b{display:block;font-size:14px}
.habitante-card small{font-size:12px;opacity:.6}
.tabs{display:flex;gap:4px;margin-bottom:16px}
.tab{flex:1;padding:10px;border:0;border-radius:14px;background:rgba(255,255,255,.06);color:#fff;cursor:pointer;font-size:13px;font-family:inherit;font-weight:600;opacity:.7}
.tab.on{background:rgba(123,230,214,.2);border:1px solid rgba(123,230,214,.4);opacity:1}
</style>
</head>
<body>
<button class="volver" onclick="location.href='circulo-ka.html'">← Círculo Ka</button>
<div class="neblina"><img src="niebla1.png" class="niebla n1" alt=""><img src="niebla2.png" class="niebla n2" alt=""></div>
<main>
  <h1>Libro de los Habitantes</h1>
  <p class="sub">Tu identidad en el Universo Ka. Lo que compartas aquí es voluntario y visible para otras habitantes.</p>
  <div class="tabs">
    <button class="tab on" id="tabMiPerfil" onclick="mostrarTab('perfil')">Mi perfil</button>
    <button class="tab" id="tabOtros" onclick="mostrarTab('otros')">Otras habitantes</button>
  </div>
  <div id="vistaPerfil">
    <div class="glass panel perfil-cabecera" id="cabeceraPerfil">
      <div class="perfil-avatar"><img id="miAvatar" src="mawari.png" alt=""></div>
      <div class="perfil-datos">
        <h2 id="miNombre">Cargando…</h2>
        <div class="guardia" id="miGuardia"></div>
        <div class="perfil-presentacion" id="miPresentacion"></div>
        <div class="perfil-creado" id="miCreado"></div>
      </div>
    </div>
    <div class="glass panel panel-editar">
      <div class="etq">Editar tu Libro</div>
      <div class="campo"><label>Nombre del universo</label><input type="text" id="editNombre" maxlength="30" placeholder="Tu nombre en el Universo"></div>
      <div class="campo"><label>Avatar</label><div class="avatares" id="avatares">
        <button data-img="mawari.png" class="on"><img src="mawari.png" alt="Mawari"></button>
        <button data-img="kaorai.png"><img src="kaorai.png" alt="Kaorai"></button>
        <button data-img="seyuma.png"><img src="seyuma.png" alt="Seyuma"></button>
        <button data-img="orukai.png"><img src="orukai.png" alt="Orukai"></button>
      </div></div>
      <div class="campo"><label>Guardián</label><select id="editGuardia">
        <option>Custodio de las Raíces Vivas</option>
        <option>Portador del Cielo Luminoso</option>
        <option>Guardián de Corrientes Antiguas</option>
        <option>Tejedor de Energía Sagrada</option>
      </select></div>
      <div class="campo"><label>Presentación (máx 500 caracteres)</label><textarea id="editPresentacion" maxlength="500" placeholder="Cuéntale al Universo quién eres… (voluntario)"></textarea></div>
      <div class="acciones"><button class="btn" id="btnGuardar">Guardar mi Libro</button></div>
      <p class="msg" id="msgPerfil"></p>
    </div>
  </div>
  <div id="vistaOtros" style="display:none">
    <div class="habitantes-lista" id="listaHabitantes"><p class="sub" style="text-align:center">Cargando habitantes…</p></div>
  </div>
</main>
<script src="supabase-client.js"></script>
<script src="circulo-auth.js"></script>
<script>
var AVATAR_SEL="mawari.png",msgPerfil=document.getElementById("msgPerfil"),miId=null;
function mostrarTab(t){
  document.getElementById("tabMiPerfil").classList.toggle("on",t==="perfil");
  document.getElementById("tabOtros").classList.toggle("on",t==="otros");
  document.getElementById("vistaPerfil").style.display=t==="perfil"?"":"none";
  document.getElementById("vistaOtros").style.display=t==="otros"?"":"none";
  if(t==="otros")cargarHabitantes();
}
async function inicializar(){
  if(window.supabaseConfigurado===undefined){await new Promise(function(r){window.addEventListener("supabase-listo",r)})}
  if(!CirculoAuth.configurado()){document.getElementById("cabeceraPerfil").innerHTML='<div class="perfil-datos"><h2>El Libro está descansando</h2></div>';return}
  var sesion=await CirculoAuth.sesionActual();
  if(!sesion){location.href="circulo-auth.html";return}
  miId=sesion.user.id;
  await cargarMiPerfil();
}
async function cargarMiPerfil(){
  try{
    var r=await supabaseClient.from("perfiles").select("*").eq("id",miId).maybeSingle();
    if(r.error)throw r.error;
    if(!r.data){
      var ins=await supabaseClient.from("perfiles").insert({id:miId,avatar:"mawari.png",nombre_universo:"Viajera"}).select().single();
      if(ins.error)throw ins.error;
      r.data=ins.data;
    }
    var p=r.data;
    document.getElementById("miAvatar").src=p.avatar;
    document.getElementById("miNombre").textContent=p.nombre_universo;
    document.getElementById("miGuardia").textContent=p.guardia;
    document.getElementById("miPresentacion").textContent=p.presentacion||"";
    document.getElementById("miCreado").textContent="Habitante desde "+new Date(p.creado_en).toLocaleDateString("es",{month:"long",year:"numeric"});
    document.getElementById("editNombre").value=p.nombre_universo;
    document.getElementById("editGuardia").value=p.guardia;
    document.getElementById("editPresentacion").value=p.presentacion||"";
    AVATAR_SEL=p.avatar;
    document.querySelectorAll(".avatares button").forEach(function(b){b.classList.toggle("on",b.dataset.img===p.avatar)});
  }catch(e){msgPerfil.textContent="No se pudo cargar: "+e.message;msgPerfil.style.color="#f2a0a8"}
}
document.querySelectorAll(".avatares button").forEach(function(b){b.addEventListener("click",function(){document.querySelectorAll(".avatares button").forEach(function(x){x.classList.remove("on")});b.classList.add("on");AVATAR_SEL=b.dataset.img})});
document.getElementById("btnGuardar").addEventListener("click",async function(){
  var nombre=document.getElementById("editNombre").value.trim();
  if(!nombre){msgPerfil.textContent="Ka susurra… tu nombre es parte de tu esencia.";msgPerfil.style.color="#f2a0a8";return}
  try{
        var r=await supabaseClient.from("perfiles").update({avatar:AVATAR_SEL,nombre_universo:nombre,guardia:document.getElementById("editGuardia").value,presentacion:document.getElementById("editPresentacion").value.trim()||null}).eq("id",miId);
    if(r.error)throw r.error;
    msgPerfil.textContent="Tu Libro se ha guardado ✨";msgPerfil.style.color="#6fe3b0";
    await cargarMiPerfil();
  }catch(e){msgPerfil.textContent="No se pudo guardar: "+e.message;msgPerfil.style.color="#f2a0a8"}
});
async function cargarHabitantes(){
  try{
    var r=await supabaseClient.from("perfiles").select("id,nombre_universo,avatar,guardia").order("creado_en",{ascending:false}).limit(30);
    if(r.error)throw r.error;
    var lista=document.getElementById("listaHabitantes");
    if(!r.data.length){lista.innerHTML='<p class="sub" style="text-align:center">Aún no hay otras habitantes.</p>';return}
    lista.innerHTML=r.data.map(function(h){return '<div class="habitante-card"><img src="'+esc(h.avatar)+'" alt=""><div><b>'+esc(h.nombre_universo)+'</b><small>'+esc(h.guardia)+'</small></div></div>'}).join("");
  }catch(e){document.getElementById("listaHabitantes").innerHTML='<p class="sub" style="text-align:center">No se pudieron cargar.</p>'}
}
function esc(t){return String(t).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
inicializar();
</script>
<script src="ka-nav.js" data-aqui="circulo" data-sin-presencia></script>
<script src="pwa.js"></script>
</body>
</html>
