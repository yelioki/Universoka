<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>El Despertar de la Presencia – Universo Ka</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',system-ui,sans-serif;min-height:100vh;display:flex;align-items:flex-start;justify-content:center;padding:40px 20px 60px;overflow-x:hidden;color:#fff;background:linear-gradient(rgba(0,0,0,.45),rgba(0,0,0,.65)),url("./fondo-ka.jpg") center/cover fixed,#0b1d1f;transition:background-color 1s}
.neblina{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.niebla{position:absolute;width:1400px;opacity:.18;filter:blur(10px)}
.n1{top:-10%;left:-40%;animation:n1 45s linear infinite}
.n2{bottom:-10%;right:-40%;animation:n2 60s linear infinite}
@keyframes n1{to{transform:translateX(150vw)}}
@keyframes n2{to{transform:translateX(-150vw)}}
.particulas{position:fixed;inset:0;pointer-events:none}
.particulas span{position:absolute;width:6px;height:6px;border-radius:50%;background:#7be6d6;box-shadow:0 0 10px #7be6d6,0 0 20px #7be6d6;animation:flotar 8s linear infinite}
@keyframes flotar{0%{transform:translateY(120px);opacity:0}30%{opacity:1}100%{transform:translateY(-250px);opacity:0}}
.avatar-panel{position:relative;width:100%;max-width:470px;padding:32px 24px;text-align:center;z-index:20;backdrop-filter:blur(14px);background:linear-gradient(rgba(10,20,20,.55),rgba(10,20,20,.72)),url("panel-ka.png") center/cover;border:1px solid rgba(123,230,214,.12);border-radius:32px;box-shadow:0 0 50px rgba(0,0,0,.45),0 0 120px rgba(123,230,214,.08);animation:flotarPanel 6s ease-in-out infinite}
@keyframes flotarPanel{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
h1{font-size:28px;margin-bottom:12px;text-shadow:0 0 10px rgba(123,230,214,.35)}
.subtitulo{font-size:14px;line-height:1.7;opacity:.95;margin-bottom:22px}
.avatar-container{position:relative;width:180px;height:180px;margin:6px auto 20px}
.aura{position:absolute;top:-15px;left:-15px;width:210px;height:210px;object-fit:contain;animation:girar 18s linear infinite}
@keyframes girar{to{transform:rotate(360deg)}}
.marco-avatar{position:absolute;top:-12px;left:-12px;width:205px;height:205px;object-fit:contain;z-index:1}
.avatar{position:absolute;top:50%;left:50%;width:155px;height:155px;border-radius:50%;overflow:hidden;z-index:2;transform:translate(-50%,-50%);box-shadow:0 0 25px rgba(123,230,214,.45);animation:respirar 4s ease-in-out infinite}
@keyframes respirar{0%,100%{transform:translate(-50%,-50%) scale(1)}50%{transform:translate(-50%,-50%) scale(1.04)}}
.avatar img{width:100%;height:100%;object-fit:cover}
.selector{display:flex;justify-content:center;align-items:center;gap:14px;margin-bottom:22px}
.btn-mini{width:48px;height:48px;border:0;border-radius:50%;cursor:pointer;font-size:18px;font-weight:700;color:#fff;background:linear-gradient(135deg,#7be6d6,#2e8f8c);transition:.3s}
.puntos{display:flex;gap:8px}
.puntos i{width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.3);transition:.3s}
.puntos i.on{background:#7be6d6;box-shadow:0 0 10px #7be6d6}
.campo{margin-bottom:15px;text-align:left}
label{display:block;margin-bottom:7px;letter-spacing:1px;text-transform:uppercase;font-size:11px;opacity:.75}
input,select{width:100%;padding:15px 18px;border-radius:24px;border:1px solid rgba(123,230,214,.35);outline:none;font-size:15px;color:#dffaf6;background:rgba(30,120,125,.65);backdrop-filter:blur(10px);transition:.3s;appearance:none;-webkit-appearance:none}
select option{background:#102020;color:#ffe8a3}
input:focus,select:focus{border-color:rgba(123,230,214,.8);box-shadow:0 0 20px rgba(123,230,214,.25)}
input::placeholder{color:rgba(255,255,255,.5)}
.btn-principal{width:100%;margin-top:18px;padding:15px;border:0;border-radius:20px;cursor:pointer;font-size:16px;font-weight:700;color:#fff;background:linear-gradient(135deg,#6fe3d4,#2d8f89);transition:.3s}
.btn-mini:hover,.btn-principal:hover{transform:scale(1.05);box-shadow:0 0 20px rgba(123,230,214,.4)}
.regalo{margin-top:14px;display:inline-block;background:none;border:1px solid rgba(255,229,143,.5);color:#ffe58f;padding:9px 16px;border-radius:18px;cursor:pointer;font-size:13px}
#ka-mensaje{margin-top:16px;font-size:14px;line-height:1.6;min-height:45px;color:#dffaf6;font-style:italic;text-shadow:0 0 12px rgba(123,230,214,.2)}
.volver{position:fixed;top:16px;left:16px;z-index:50;padding:11px 16px;border:0;border-radius:20px;background:rgba(255,255,255,.85);color:#17393b;font-weight:700;cursor:pointer}
.portal-transicion{position:fixed;inset:0;background:radial-gradient(circle,rgba(123,230,214,.8),#000);opacity:0;pointer-events:none;z-index:999;transition:1.5s}
@media(max-width:768px){h1{font-size:23px}.avatar-panel{padding:26px 18px;margin-top:34px}}
</style>
</head>
<body>
<div class="portal-transicion" id="portal"></div>
<div class="neblina"><img src="niebla1.png" class="niebla n1" alt=""><img src="niebla2.png" class="niebla n2" alt=""></div>
<div class="particulas"></div>
<button class="volver" onclick="location.href='index.html'">← Volver</button>

<div class="avatar-panel">
  <h1>El Despertar de la Presencia</h1>
  <p class="subtitulo">Ka ha sentido tu llegada…<br><br>Antes de cruzar los caminos del tepuy, elige la presencia que te acompañará.</p>

  <div class="avatar-container">
    <img src="aura.png" class="aura" alt="">
    <img src="marco-avatar.png" class="marco-avatar" alt="">
    <div class="avatar"><img id="imagenAvatar" src="mawari.png" alt="Tu avatar"></div>
  </div>

  <div class="selector">
    <button class="btn-mini" onclick="cambiar(-1)" aria-label="Anterior">⬅</button>
    <div class="puntos" id="puntos"></div>
    <button class="btn-mini" onclick="cambiar(1)" aria-label="Siguiente">➡</button>
  </div>

  <div class="campo"><label for="nombre">Tu nombre</label><input type="text" id="nombre" maxlength="30" placeholder="Escribe tu nombre..." autocomplete="given-name"></div>
  <div class="campo"><label for="esencia">Tu esencia</label>
    <select id="esencia"><option>Custodio de las Raíces Vivas</option><option>Portador del Cielo Luminoso</option><option>Guardián de Corrientes Antiguas</option><option>Tejedor de Energía Sagrada</option></select></div>
  <div class="campo"><label for="auraSelect">Color de tu aura</label>
    <select id="auraSelect"><option>Verde Musgo Ancestral</option><option>Turquesa Bioluminiscente</option><option>Niebla Azul del Tepuy</option><option>Ámbar de la Tierra Viva</option></select></div>
  <div class="campo"><label for="simbolo">Símbolo guardián</label>
    <select id="simbolo"><option>Llave del Umbral</option><option>Runa del Cielo Vivo</option><option>Piedra de Corriente Antigua</option><option>Sello del Portal Sagrado</option></select></div>

  <button class="btn-principal" onclick="guardar()">Entrar al Universo ✨</button>
  <button class="regalo" onclick="regalo()">🎁 Una ofrenda para comenzar</button>
  <p id="ka-mensaje">Ka escucha tu energía… el portal comenzará a reconocerte 🌿</p>
</div>

<audio id="sonidoAmbiente" loop preload="auto"><source src="bosque.mp3" type="audio/mpeg"></audio>

<script>
var FORMULARIO_REGALO = "https://docs.google.com/forms/d/e/1FAIpQLScbbVA1uPu8k10kjzxFGSu54BFMLpW-mpUGIi5GJZwKfBU0Hw/viewform";

for (var i = 0; i < 40; i++) {
  var p = document.createElement("span");
  p.style.left = Math.random() * 100 + "vw"; p.style.top = Math.random() * 100 + "vh";
  p.style.animationDuration = (4 + Math.random() * 6) + "s";
  document.querySelector(".particulas").appendChild(p);
}

var personajes = [
  { imagen: "mawari.png", esencia: "Custodio de las Raíces Vivas", aura: "Verde Musgo Ancestral", simbolo: "Llave del Umbral", fondo: "rgba(70,120,90,.25)" },
  { imagen: "kaorai.png", esencia: "Portador del Cielo Luminoso", aura: "Turquesa Bioluminiscente", simbolo: "Runa del Cielo Vivo", fondo: "rgba(60,170,170,.25)" },
  { imagen: "seyuma.png", esencia: "Guardián de Corrientes Antiguas", aura: "Niebla Azul del Tepuy", simbolo: "Piedra de Corriente Antigua", fondo: "rgba(80,120,190,.25)" },
  { imagen: "orukai.png", esencia: "Tejedor de Energía Sagrada", aura: "Ámbar de la Tierra Viva", simbolo: "Sello del Portal Sagrado", fondo: "rgba(180,130,60,.25)" }
];
var indice = 0;
var mensaje = document.getElementById("ka-mensaje");
var ocupadoHasta = 0;
var puntos = document.getElementById("puntos");
personajes.forEach(function () { puntos.appendChild(document.createElement("i")); });

function pintar(frase) {
  var pj = personajes[indice];
  document.getElementById("imagenAvatar").src = pj.imagen;
  document.getElementById("esencia").value = pj.esencia;
  document.getElementById("auraSelect").value = pj.aura;
  document.getElementById("simbolo").value = pj.simbolo;
  document.body.style.backgroundColor = pj.fondo;
  Array.prototype.forEach.call(puntos.children, function (d, k) { d.className = k === indice ? "on" : ""; });
  if (frase) { mensaje.innerText = frase; ocupadoHasta = Date.now() + 4000; }
}
function cambiar(d) { indice = (indice + d + personajes.length) % personajes.length; pintar("Ka siente una nueva presencia… ✨"); }

function regalo() {
  window.open(FORMULARIO_REGALO, "_blank");
  mensaje.innerText = "La ofrenda ha sido abierta… vuelve cuando estés lista para continuar ✨";
  ocupadoHasta = Date.now() + 6000;
}

function guardar() {
  var nombre = document.getElementById("nombre").value.trim();
  if (!nombre) { mensaje.innerText = "Ka susurra… tu nombre es parte de tu esencia 🌿"; ocupadoHasta = Date.now() + 4000; return; }
  var pj = personajes[indice];
  try {
    localStorage.setItem("nombreAvatar", nombre);
    localStorage.setItem("personajeAvatar", pj.imagen);
    localStorage.setItem("esenciaAvatar", document.getElementById("esencia").value);
    localStorage.setItem("auraAvatar", document.getElementById("auraSelect").value);
    localStorage.setItem("simboloAvatar", document.getElementById("simbolo").value);
  } catch (e) {}
  mensaje.innerText = "Bienvenido, " + nombre + "… Ka ya reconoce tu energía ✨";
  document.getElementById("portal").style.opacity = "1";
  setTimeout(function () { location.href = "mapa.html"; }, 1800);
}

var frases = ["Las raíces recuerdan tu energía... 🌿","Ka escucha el eco de tu presencia... ✨","Los portales observan tu llegada...","El tepuy despierta lentamente..."];
setInterval(function () { if (Date.now() < ocupadoHasta) return; mensaje.innerText = frases[Math.floor(Math.random() * frases.length)]; }, 7000);

document.body.addEventListener("click", function () {
  var a = document.getElementById("sonidoAmbiente"); a.volume = .35; a.play().catch(function () {});
}, { once: true });

pintar();
</script>
</body>
</html>
