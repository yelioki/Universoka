<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Entrar al Círculo Ka — Universo Ka</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',system-ui,sans-serif}
html,body{height:100%;overflow:hidden}
body{color:#fff;background:radial-gradient(circle at center,#2f6f73 0%,#17393b 40%,#0b1d1f 100%);display:flex;align-items:center;justify-content:center;padding:20px}
.neblina{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:1}
.niebla{position:absolute;width:1400px;opacity:.18;filter:blur(10px)}
.n1{top:-10%;left:-40%;animation:n1 45s linear infinite}
.n2{bottom:-10%;right:-40%;animation:n2 60s linear infinite}
@keyframes n1{to{transform:translateX(150vw)}}
@keyframes n2{to{transform:translateX(-150vw)}}
.particulas{position:fixed;inset:0;pointer-events:none;z-index:2}
.particulas span{position:absolute;width:5px;height:5px;border-radius:50%;background:#ffe58f;box-shadow:0 0 10px #ffe58f,0 0 20px rgba(255,215,0,.5);animation:flotar 8s linear infinite}
@keyframes flotar{0%{transform:translateY(120px);opacity:0}30%{opacity:1}100%{transform:translateY(-250px);opacity:0}}
.panel{position:relative;z-index:10;max-width:440px;width:100%;padding:40px 32px;text-align:center;background:rgba(5,22,24,.62);backdrop-filter:blur(14px);border:1px solid rgba(123,230,214,.25);border-radius:28px;box-shadow:0 0 50px rgba(0,0,0,.5),0 0 100px rgba(123,230,214,.1)}
.panel h1{font-size:28px;margin-bottom:10px;color:#7be6d6;text-shadow:0 0 18px rgba(123,230,214,.4)}
.panel .sub{font-size:14px;line-height:1.6;opacity:.9;margin-bottom:28px}
.aura-circulo{width:80px;height:80px;margin:0 auto 20px;border-radius:50%;background:radial-gradient(circle,rgba(255,229,143,.3),transparent 70%);border:1px solid rgba(255,229,143,.3);box-shadow:0 0 30px rgba(255,229,143,.2);animation:latir 4s ease-in-out infinite}
@keyframes latir{0%,100%{transform:scale(.95);opacity:.6}50%{transform:scale(1.05);opacity:1}}
.btn{width:100%;margin-top:8px;padding:15px;border:0;border-radius:20px;cursor:pointer;font-size:16px;font-weight:700;color:#fff;background:linear-gradient(135deg,#6fe3d4,#2d8f89);transition:.3s;font-family:inherit}
.btn:hover{transform:scale(1.02);box-shadow:0 0 22px rgba(123,230,214,.45)}
.btn:disabled{opacity:.5;cursor:default;transform:none}
.btn.sec{background:transparent;border:1px solid rgba(255,255,255,.2);margin-top:10px}
.btn.sec:hover{background:rgba(255,255,255,.08)}
#msg{margin-top:14px;font-size:13px;line-height:1.5;min-height:30px;color:#dffaf6;font-style:italic}
#msg.err{color:#f2a0a8}
.volver{position:fixed;top:16px;left:16px;z-index:50;padding:11px 16px;border:0;border-radius:20px;background:rgba(255,255,255,.85);color:#17393b;font-weight:700;cursor:pointer;font-size:14px;font-family:inherit;text-decoration:none}
@media(max-width:400px){.panel{padding:30px 20px}.panel h1{font-size:24px}}
</style>
</head>
<body>
<a class="volver" href="mapa.html">← Volver al Tepuy</a>
<div class="neblina"><img src="niebla1.png" class="niebla n1" alt=""><img src="niebla2.png" class="niebla n2" alt=""></div>
<div class="particulas" id="particulas"></div>

<div class="panel">
  <div class="aura-circulo"></div>
  <h1>El Círculo Ka</h1>
  <p class="sub">El santuario donde los mundos se encuentran.<br>Ka te reconoce al instante, sin barreras.</p>

  <button class="btn" id="btnEntrar">Entrar al Círculo ✨</button>
  <button class="btn sec" id="btnExplorar">Solo quiero explorar el Universo</button>

  <p id="msg">Ka siente tu llegada… 🌿</p>
</div>

<script src="supabase-client.js"></script>
<script>
for (var i = 0; i < 30; i++) {
  var p = document.createElement("span");
  p.style.left = Math.random()*100+"vw"; p.style.top = Math.random()*100+"vh";
  p.style.animationDuration = (4+Math.random()*6)+"s";
  document.getElementById("particulas").appendChild(p);
}

var msg = document.getElementById("msg");
var btnEntrar = document.getElementById("btnEntrar");
var btnExplorar = document.getElementById("btnExplorar");

function mostrar(t, tipo) { msg.textContent = t; msg.className = tipo || ""; }

window.addEventListener("supabase-listo", async function () {
  if (!window.supabaseClient || !window.supabaseConfigurado) {
    mostrar("El Círculo aún no está configurado. Vuelve pronto.", "err");
    btnEntrar.disabled = true;
    return;
  }
  try {
    var r = await supabaseClient.auth.getSession();
    if (r.data && r.data.session) {
      location.href = "circulo-ka.html";
    }
  } catch (e) {}
});

if (window.supabaseConfigurado !== undefined) {
  window.dispatchEvent(new Event("supabase-listo"));
}

btnEntrar.addEventListener("click", async function () {
  btnEntrar.disabled = true;
  mostrar("Ka te está reconociendo…");
  try {
    var r = await supabaseClient.auth.signInAnonymously();
    if (r.error) throw r.error;
    mostrar("Bienvenida al Círculo…");
    setTimeout(function () { location.href = "circulo-ka.html"; }, 800);
  } catch (e) {
    mostrar("No se pudo entrar: " + (e.message || "intenta de nuevo"), "err");
    btnEntrar.disabled = false;
  }
});

btnExplorar.addEventListener("click", function () {
  location.href = "mapa.html";
});
</script>
<script src="pwa.js"></script>
</body>
</html>
